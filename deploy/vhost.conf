# Host nginx: /etc/nginx/sites-available/factory-board.gapchix.io
# Then: ln -s into sites-enabled, nginx -t, reload, and
#   certbot --nginx -d factory-board.gapchix.io
# which adds the 443 server block and the redirect. Then add, in that 443 block,
# after the options-ssl-nginx.conf include (as on every gapchix site since 2026-09-27):
#   add_header Strict-Transport-Security "max-age=31536000" always;

server {
    listen 80;
    server_name factory-board.gapchix.io;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
