# Host nginx: /etc/nginx/sites-available/factory-board.gapchix.io
# Then: ln -s into sites-enabled, nginx -t, reload, and
#   certbot --nginx -d factory-board.gapchix.io
# which adds the 443 server block and the redirect.

server {
    listen 80;
    server_name factory-board.gapchix.io;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
