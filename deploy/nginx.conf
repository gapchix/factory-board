# Serves apps/web/out inside the container. The host's nginx terminates TLS and
# proxies here; the headers are set here so they are versioned with the app.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # "Your save never leaves the browser", enforced rather than promised: the
    # page may talk to itself and to the visit counter (ADR 37), and nothing
    # else. 'unsafe-inline' because the static export bootstraps with inline
    # scripts and Emotion injects inline styles; without it the page is blank.
    # blob: for the parse and extract workers, data: and blob: for the map
    # and icons.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://stats.gapchix.io; connect-src 'self' https://stats.gapchix.io; worker-src 'self' blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The export writes these without an extension, so nginx cannot guess.
    location = /opengraph-image { default_type image/png; }
    location = /apple-icon { default_type image/png; }

    # Content-hashed assets never change under the same name.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy "default-src 'none'" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
}
