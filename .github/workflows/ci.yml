name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The app is type-checked here too, which it was not until the demo
      # database existed: it imports a generated database, and the extracted one
      # is never committed (docs/adr/0003). CI now falls back to the built-in
      # demo like any other machine without the game (docs/adr/0029).
      - run: npm run typecheck
      - run: npm run lint
      # Integration tests still skip: they pin real numbers against the real
      # extracted database, and the demo is deliberately not it.
      - run: npm test
      # And it builds. A static export that only ever built on the maintainer's
      # own machine is one nobody else can be sure still works.
      - run: npm run build
